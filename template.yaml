AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  GroundedOps - AI Knowledge Retrieval System
  Serverless RAG Pipeline using Amazon S3, AWS Lambda, Amazon Bedrock (Amazon Nova),
  and S3 Vectors, secured with Amazon Cognito, IAM, and API Gateway.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage environment

  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Amazon Bedrock embedding model ID

  NovaModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    AllowedValues:
      - amazon.nova-micro-v1:0
      - amazon.nova-lite-v1:0
      - amazon.nova-pro-v1:0
    Description: Amazon Bedrock Amazon Nova Foundation Model ID for grounded generation

  ChunkSize:
    Type: Number
    Default: 800
    Description: Text chunk size in characters

  ChunkOverlap:
    Type: Number
    Default: 150
    Description: Text chunk overlap in characters

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
        NOVA_MODEL_ID: !Ref NovaModelId
        CHUNK_SIZE: !Ref ChunkSize
        CHUNK_OVERLAP: !Ref ChunkOverlap
        VECTORS_BUCKET_NAME: !Ref S3VectorsBucket
        LOG_LEVEL: INFO

Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub groundedops-documents-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  S3VectorsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub groundedops-vectors-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub groundedops-users-${Environment}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub groundedops-client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  CognitoAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: System administrators with full document ingestion and management rights
      UserPoolId: !Ref CognitoUserPool
      Precedence: 0

  CognitoEngineersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Engineers
      Description: Operational engineers with document query and contribution access
      UserPoolId: !Ref CognitoUserPool
      Precedence: 1

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub groundedops-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3DocumentAndVectorAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentBucket.Arn
                  - !Sub "${DocumentBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt S3VectorsBucket.Arn
                  - !Sub "${S3VectorsBucket.Arn}/*"
        - PolicyName: AmazonBedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                  - bedrock:RetrieveAndGenerate
                Resource:
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"

  GroundedOpsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.query_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundedOpsApi
            Path: /query
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.ingest_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 180
      Events:
        IngestApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundedOpsApi
            Path: /ingest
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.health_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundedOpsApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE
        StatsApi:
          Type: Api
          Properties:
            RestApiId: !Ref GroundedOpsApi
            Path: /stats
            Method: get
            Auth:
              Authorizer: NONE

Outputs:
  ApiEndpoint:
    Description: Base URL for GroundedOps REST API
    Value: !Sub "https://${GroundedOpsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  CognitoUserPoolId:
    Description: Amazon Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Amazon Cognito App Client ID
    Value: !Ref CognitoUserPoolClient
  DocumentBucketName:
    Description: S3 Bucket for raw document storage
    Value: !Ref DocumentBucket
  S3VectorsBucketName:
    Description: S3 Bucket for serverless S3 Vectors index storage
    Value: !Ref S3VectorsBucket
